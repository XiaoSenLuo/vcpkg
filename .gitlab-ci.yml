# 定义流水线阶段
stages:
  - sync

# 同步作业
sync-from-github:
  stage: sync
  # 使用一个包含 git 的轻量级镜像
  image: alpine/git:latest
  # 只在定时触发的流水线执行，避免每次 push 都运行
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
  before_script:
    # 设置 Git 用户信息，以便执行合并操作
    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@gitlab.local"
    # 配置使用 Token 进行身份验证的远程仓库地址
    # 将 'https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git' 替换为带 token 的地址
    - git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # 添加 GitHub 上游仓库
    - git remote add upstream https://github.com/microsoft/vcpkg.git
  script:
    # 1. 获取当前分支（这里假设是 dev）
    - git checkout $CI_COMMIT_BRANCH
    # 2. 从 GitHub (origin) 拉取 master 分支的最新代码
    - git fetch upstream master
    # 3. 将 upstream/master 合并到当前分支（dev）
    #    使用 --no-edit 避免弹出合并信息编辑器
    - git merge upstream/master --no-edit
    # 4. 将合并后的 dev 分支推送到你的 GitLab 仓库
    - git push origin HEAD:$CI_COMMIT_BRANCH